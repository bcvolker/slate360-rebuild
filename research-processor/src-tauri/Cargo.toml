[package]
name = "slate360-research-processor"
version = "0.1.0"
description = "Slate360 Research Processor (ODGS-SLAM, academic research only)"
authors = ["Slate360"]
edition = "2021"

[lib]
name = "slate360_research_processor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
